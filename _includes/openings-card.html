{% assign card_url = include.link | default: include.url %}

<a href="{{ card_url | relative_url | uri_escape }}" class="opening-card">
  <div class="opening-card-media">
    <span class="opening-card-badge">
      <span class="opening-card-dot"></span>
      Available
    </span>

    <img
      src="{{ include.image | relative_url | uri_escape }}"
      alt="{{ include.title | default: "opening image" | regex_strip }}"
      loading="lazy"
      {% include fallback.html %}
    >
  </div>

  <div class="opening-card-content">
    {% if include.title %}
      <div class="opening-card-title">{{ include.title }}</div>
    {% endif %}

    {% if include.description %}
      <p class="opening-card-description">
        {{ include.description | markdownify | remove: "<p>" | remove: "</p>" }}
      </p>
    {% endif %}
  </div>
</a>
