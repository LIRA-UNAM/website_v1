name: update-citations
run-name: update citations

on:
  # run when called from another workflow
  workflow_call:
    outputs:
      changed:
        value: ${{ jobs.update-citations.outputs.changed }}

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_COLOR: true

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch contents
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "_cite/requirements.txt"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade --requirement ./_cite/requirements.txt

      - name: Restore citation cache
        uses: actions/cache/restore@v6
        with:
          path: _cite/.cache
          key: citation-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citation-cache-

      - name: Build updated citations
        run: python _cite/cite.py

      # saved even on failure, so a partial run's lookups aren't lost
      - name: Save citation cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: _cite/.cache
          key: citation-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check if citations changed
        id: changed
        run: |
          if git diff --quiet -- _data/citations.yaml; then
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # main only accepts reviewed pull requests, so never commit to it directly
      - name: Open pull request with updated citations
        if: steps.changed.outputs.files_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: citation-update
          add-paths: _data/citations.yaml
          commit-message: Update citations
          title: Periodic citation update
          body: |
            Automated refresh of `_data/citations.yaml`. Merging this PR redeploys the site.

            Checks don't run automatically on PRs opened by this workflow. To build this PR, close and reopen it.

    outputs:
      changed: ${{ steps.changed.outputs.files_changed || false }}
