name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # opens a pull request if the merged changes need new citations
  update-citations:
    uses: ./.github/workflows/update-citations.yaml

  build-site:
    uses: ./.github/workflows/build-site.yaml
    with:
      deploy: true
    secrets: inherit
